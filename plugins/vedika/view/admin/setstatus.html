<!--vedika/view/admin/setstatus.html-->

<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    <h4 class="modal-title">Set Status Vedika</h4>
</div>
<div class="modal-body">
  <div class="row">
    <form id="form_status_vedika" name="vedika" action="" method="POST">
      <input type="hidden" name="submit" value="1">
      <input type="hidden" name="tgl_registrasi" class="form-control" required value="{$set_status.tglsep}" />
      <input type="hidden" name="jnspelayanan" class="form-control" required value="{$set_status.jnspelayanan}" />
      <div class="col-md-4">
        <div class="form-group">
          <label>No. Rekam Medis</label>
          <input type="text" name="no_rkm_medis" class="form-control" placeholder="Nomor RM" required readonly value="{$set_status.nomr}" />
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label>Nomor Rawat</label>
          <input type="text" name="no_rawat" class="form-control" placeholder="Nomor Rawat" required readonly value="{$set_status.no_rawat}" />
        </div>
      </div>
      {if: $jenis}
      <div class="col-md-4">
        <div class="form-group">
          <label>Jenis Klaim</label>
          <select name="jenis" class="form-control">
            <option value="1"{if: $jenis.jenis == '1'} selected{/if}>Rawat Inap</option>
            <option value="2"{if: $jenis.jenis == '2'} selected{/if}>Rawat Jalan</option>
          </select>
        </div>
      </div>
      {/if}
      <div class="col-md-12">
        <div class="form-group">
          <label>Nomor SEP</label>
          <input type="text" name="nosep" class="form-control" placeholder="Nomor SEP" required readonly value="{$set_status.no_sep}" />
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label>Status Klaim</label>
          <select name="status" class="form-control">
            <option value="Lengkap"{if: $jenis.status == 'Lengkap'} selected{/if}>Lengkap</option>
            <option value="Pengajuan"{if: $jenis.status == 'Pengajuan'} selected{/if}>Pengajuan</option>
            <option value="Perbaiki"{if: $jenis.status == 'Perbaiki'} selected{/if}>Perbaiki</option>
          </select>
        </div>
      </div>
      <div class="hidden col-md-12">
        <div class="form-group">
          <label>Catatan dan Umpan Balik</label>
          <textarea name="catatan" rows="8" cols="80" class="form-control"></textarea>
        </div>
      </div>
      <div class="col-md-12">
        <div class="form-group">
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </div>
    </form>
  </div>
  <div class="hidden row">
    <div class="col-md-12">
      <h4>Feedback</h4>
      <div class="comments-list">
        {loop: $vedika}
        <div class="media">
          <p class="pull-right"><small>{$value.tanggal}</small></p>
          <a class="media-left" href="#">
            {if: $value.username == 'bpjs'}
              <img src="{?=url()?}/assets/img/avatar-bpjs.png" width="30px">
            {else}
              <img src="{?=url()?}/{$logo}" width="30px">
            {/if}
          </a>
          <div class="media-body">
            {if: $value.username == 'bpjs'}
              <h5 class="media-heading user_name">Verifikator BPJS</h5>
            {else}
              <h5 class="media-heading user_name">{$nama_instansi}</h5>
            {/if}
            {$value.catatan}<br>{$value.fullname}
          </div>
        </div>
        {/loop}
      </div>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-primary" data-dismiss="modal">Tutup</button>
</div>
<script type="text/javascript">
$(document)
  .off("submit.statusVedika", "#form_status_vedika")
  .on("submit.statusVedika", "#form_status_vedika", function(event){
    event.preventDefault();

    var baseURL = mlite.url + '/' + mlite.admin;
    var form = $(this);
    var jenis = form.find('[name="jenis"]').val();
    var jnspelayanan = form.find('[name="jnspelayanan"]').val();
    var rawatInap = (jenis === '1' || jnspelayanan === '1');
    var endpoint = rawatInap ? 'indexinap' : 'index';
    var url = baseURL + '/vedika/' + endpoint + '?t=' + mlite.token;
    var tombol = form.find('button[type="submit"]');

    tombol.prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> Menyimpan...');

    $.post(url, form.serialize())
      .done(function() {
        $('#statusModal').one('hidden.bs.modal', function () {
          sessionStorage.setItem('toast_success', 'Status Vedika berhasil disimpan');
          window.location.reload();
        });

        $('#statusModal').modal('hide');
      })
      .fail(function() {
        showToast('Gagal menyimpan status Vedika', 'error');
        tombol.prop('disabled', false).html('Simpan');
      });
  });

$('select').selectator();
</script>
