<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span> Tutup</button>
    <h4 class="modal-title">Ubah Prosedur</h4>
</div>
<div class="modal-body">

  <div id="icd10dan9">
    <div class="panel panel-default">
      <div class="panel-body">
        <input type="hidden" name="no_rawat" value="{$no_rawat}">
        <div class="form-group">
          <div class="row">
              <div class="col-sm-12">
                <div class="form-group icd9">
                  <label for="">Prosedur (ICD 9)</label>
                  <button id="filter" class="btn btn-default">
                      <span id="kode_icd9">kode</span>
                  </button>
                  <div class="btn-group">
                      <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown">
                          <span data-bind="label" id="prioritas_icd9">1</span> <span class="caret"></span>
                      </button>
                      <ul class="dropdown-menu" role="menu" style="min-width:0px;">
                          <li><a>1</a></li>
                          <li><a>2</a></li>
                          <li><a>3</a></li>
                          <li><a>4</a></li>
                          <li><a>5</a></li>
                          <li><a>6</a></li>
                          <li><a>7</a></li>
                          <li><a>8</a></li>
                          <li><a>9</a></li>
                      </ul>
                  </div>
                  <div class="input-group">
                    <input type="text" name="icd9" id="icd9" class="form-control" autocomplete="on" />
                    <input type="hidden" name="status" class="form-control" value="{$status_lanjut}" />
                    <ul class="list-group" id="icd9List" style="z-index:1000;position:absolute;width:100%;"></ul>
                    <span class="input-group-btn">
                        <button id="simpan_icd9" class="btn btn-primary btn-block">
                            <span class="glyphicon glyphicon-plus"></span>
                        </button>
                    </span>
                  </div>
                </div>
              </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="table-responsive no-margin" id="data_prosedur">
    <p>Angka prioritas terkecil akan jadi prosedur utama/primary</p>  
    <table class="table">
      <thead>
        <tr>
          <th>Kode</th>
          <th>Nama Prosedur</th>
          <th>Prioritas</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>
        {loop: $prosedur_pasien}
        <tr>
          <td>{$value.kode}</td>
          <td>{$value.deskripsi_panjang}</td>
          <td contenteditable="true" data-old_value="{$value.prioritas}" onBlur="saveProsedur(this,'prioritas','{$value.no_rawat}','{$value.kode}','{$status_lanjut}')" onClick="highlightEdit(this);">{$value.prioritas}</td>
          <td><a href="" class="btn btn-xs btn-danger fa fa-trash hapus_prosedur" data-no_rawat="{$value.no_rawat}" data-kode="{$value.kode}" data-prioritas="{$value.prioritas}"></a></td>
        </tr>
        {/loop}
      </tbody>
    </table>
  </div>

</div>

<div class="modal-footer">
    <button type="button" class="btn btn-primary" data-dismiss="modal">Tutup</button>
</div>

<script type="text/javascript">
  $(document).ready(function () {
    $(".icd9 .dropdown-menu li a").click(function () {
        var prioritas_icd9 = $(this).text();
        $(this).closest('.form-group').find('#prioritas_icd9').text(prioritas_icd9);
    });
  });
</script>
<script>
  $('#icd9').keyup(function(){
       var query = $(this).val();
       if(query != '')
       {
            $.ajax({
                 url: "{?=url([ADMIN, 'icd', 'icd9RS'])?}",
                 method:"POST",
                 data:{query:query},
                 success:function(data)
                 {
                      $('#icd9List').fadeIn();
                      $('#icd9List').html(data);
                 }
            });
       }
       $('#icd9List').fadeIn();
  });
  $('#icd9List').on('click', 'li', function(){
       $('#icd9').val($(this).text().split(': ')[1]);
       $('#kode_icd9').text($(this).text().split(': ')[0]);
       var kode_icd9 = $('#kode_icd9').val();
       $('#icd9List').fadeOut();
  });
</script>
<script type="text/javascript">
  // tombol simpan diklik
  $("#icd10dan9").on("click", "#simpan_icd9", function(event){
    var baseURL = mlite.url + '/' + mlite.admin;
    event.preventDefault();
    var no_rawat = $('#statusModal input:hidden[name=no_rawat]').val();
    var prioritas = $('#prioritas_icd9').text();
    var nama = $('input:text[name=icd9]').val();
    var kode = $('#kode_icd9').text();
    var status = $('#statusModal input:hidden[name=status]').val();

    var url = baseURL + '/icd/saveicd9?t=' + mlite.token;

    $.post(url,{
      no_rawat: no_rawat,
      prioritas: prioritas,
      nama: nama,
      status: status,
      kode: kode
    } ,function(data) {
      alert('Data prosedur ' + kode + ' telah disimpan!!');

      //bersih();
      //$('#notif').html("<div class=\"alert alert-success alert-dismissible fade in\" role=\"alert\" style=\"border-radius:0px;margin-top:-15px;\">"+
      //"Data ICD 9 (Prosedur) pasien telah disimpan!"+
      //"<button type=\"button\" class=\"close\" data-dismiss=\"alert\" aria-label=\"Close\">&times;</button>"+
      //"</div>").show();
    });
  });
</script>

<script>
  function highlightEdit(editableObj) {
  	$(editableObj).css("background","#FFF");
  }
  function saveProsedur(editableObj,column,no_rawat,kode,status) {
  	// no change change made then return false
  	if($(editableObj).attr('data-old_value') === editableObj.innerHTML)
  	return false;
  	// send ajax to update value
  	$(editableObj).css("background","#FFF url({?=url()?}/assets/img/loader.gif) no-repeat right");
  	$.ajax({
  		url: "{?=url([ADMIN,'vedika','saveprosedur'])?}",
  		cache: false,
  		data:'column='+column+'&prioritas='+editableObj.innerHTML+'&no_rawat='+no_rawat+'&kode='+kode+'&status='+status,
  		success: function(response)  {
  			console.log(response);
  			// set updated value as old value
  			$(editableObj).attr('data-old_value',editableObj.innerHTML);
  			$(editableObj).css("background","#FDFDFD");
  		}
     });
  }
</script>

<script>
  (function () {
    var noRawatRingkasan = '{?=convertNoRawat($no_rawat)?}';
    var statusRingkasan = '{$status_lanjut}';
    var refreshDimulai = false;

    // Script ini dimuat bersama isi modal, jadi tidak bergantung pada
    // relatedTarget atau handler yang dibuat saat halaman Index dirender.
    $('#statusModal')
      .off('click.vedikaRingkasan', '[data-dismiss="modal"]')
      .on('click.vedikaRingkasan', '[data-dismiss="modal"]', refreshSekali)
      .off('hidden.bs.modal.vedikaRingkasan')
      .on('hidden.bs.modal.vedikaRingkasan', refreshSekali);

    function refreshSekali() {
      if (refreshDimulai) {
        return;
      }

      refreshDimulai = true;
      refreshRingkasanVedika(noRawatRingkasan, statusRingkasan);
    }

    function refreshRingkasanVedika(noRawat, status) {
      var baseURL = mlite.url + '/' + mlite.admin;
      var url = baseURL + '/vedika/ringkasanmedis/'
        + encodeURIComponent(status) + '/'
        + encodeURIComponent(noRawat)
        + '?t=' + encodeURIComponent(mlite.token);

      $.ajax({
        url: url,
        method: 'GET',
        dataType: 'json',
        cache: false
      }).done(function (response) {
        $('.js-ubah-medis').filter(function () {
          return $(this).attr('data-no-rawat') === noRawat;
        }).each(function () {
          var target = $(this).attr('data-summary-target');
          var items = target.indexOf('#diagnosa-') === 0
            ? response.diagnosa
            : response.prosedur;

          renderRingkasanVedika($(target), items);
        });
      }).fail(function (xhr) {
        console.error('Gagal memperbarui ringkasan medis.', xhr.status);
      });
    }

    function renderRingkasanVedika($target, items) {
      $target.empty();

      if (!items || items.length === 0) {
        $target.text('-');
        return;
      }

      $.each(items, function (_, item) {
        $target.append(
          document.createTextNode('- (' + item.kode + ')-' + item.nama),
          $('<br>')
        );
      });
    }
  })();
</script>
