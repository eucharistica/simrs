<div class="modal-header">
  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
  <h4 class="modal-title"><i class="fa fa-stethoscope"></i> SOAP Poli</h4>
</div>
<div class="modal-body">
  <form id="form_soap_poli">
    <input type="hidden" name="no_rawat" value="{$reg_periksa.no_rawat}">
    <div class="panel panel-default">
      <div class="panel-heading"><strong>Identitas Kunjungan</strong></div>
      <div class="panel-body">
        <div class="row">
          <div class="col-md-4"><label>No. Rawat</label><input type="text" class="form-control" value="{$reg_periksa.no_rawat}" readonly></div>
          <div class="col-md-4"><label>No. RM</label><input type="text" class="form-control" value="{$reg_periksa.no_rkm_medis}" readonly></div>
          <div class="col-md-4"><label>Nama Pasien</label><input type="text" class="form-control" value="{$reg_periksa.nm_pasien}" readonly></div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div class="col-md-3"><label>Tanggal Pemeriksaan</label><input type="text" name="tgl_perawatan" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.tgl_perawatan)?}{else}{?=date('Y-m-d')?}{/if}" required></div>
          <div class="col-md-3"><label>Jam Pemeriksaan</label><input type="text" name="jam_rawat" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.jam_rawat)?}{else}{?=date('H:i:s')?}{/if}" required></div>
          <div class="col-md-3"><label>Dokter Registrasi</label><input type="text" class="form-control" value="{$reg_periksa.nm_dokter}" readonly></div>
          <div class="col-md-3"><label>Alergi</label><input type="text" name="alergi" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.alergi)?}{/if}"></div>
        </div>
      </div>
    </div>
    <div class="panel panel-default">
      <div class="panel-heading"><strong>Pemeriksaan</strong></div>
      <div class="panel-body">
        <div class="row">
          <div class="col-sm-2"><label>Suhu (C)</label><input type="text" name="suhu_tubuh" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.suhu_tubuh)?}{/if}"></div>
          <div class="col-sm-2"><label>Tensi (mmHg)</label><input type="text" name="tensi" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.tensi)?}{/if}"></div>
          <div class="col-sm-2"><label>Nadi (/mnt)</label><input type="text" name="nadi" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.nadi)?}{/if}"></div>
          <div class="col-sm-2"><label>RR (/mnt)</label><input type="text" name="respirasi" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.respirasi)?}{/if}"></div>
          <div class="col-sm-2"><label>Tinggi (cm)</label><input type="text" name="tinggi" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.tinggi)?}{/if}"></div>
          <div class="col-sm-2"><label>Berat (kg)</label><input type="text" name="berat" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.berat)?}{/if}"></div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div class="col-sm-3"><label>Kesadaran</label><select name="kesadaran" class="form-control">
            <option value="Compos Mentis 15-14"{if: $asesmen && $asesmen.kesadaran == 'Compos Mentis 15-14'} selected{/if}>Compos Mentis 15-14</option>
            <option value="Apatis 13-12"{if: $asesmen && $asesmen.kesadaran == 'Apatis 13-12'} selected{/if}>Apatis 13-12</option>
            <option value="Delirium 11-10"{if: $asesmen && $asesmen.kesadaran == 'Delirium 11-10'} selected{/if}>Delirium 11-10</option>
            <option value="Somnolen 9-7"{if: $asesmen && $asesmen.kesadaran == 'Somnolen 9-7'} selected{/if}>Somnolen 9-7</option>
            <option value="Sopor 6-4"{if: $asesmen && $asesmen.kesadaran == 'Sopor 6-4'} selected{/if}>Sopor 6-4</option>
            <option value="Coma 3"{if: $asesmen && $asesmen.kesadaran == 'Coma 3'} selected{/if}>Coma 3</option>
          </select></div>
          <div class="col-sm-3"><label>GCS (E,V,M)</label><input type="text" name="gcs" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.gcs)?}{/if}"></div>
          <div class="col-sm-3"><label>SpO2 (%)</label><input type="text" name="spo" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.spo)?}{/if}"></div>
          <div class="col-sm-3"><label>Imunisasi ke-</label><select name="imun_ke" class="form-control">
            <option value="-"{if: !$asesmen || $asesmen.imun_ke == '-'} selected{/if}>-</option>
            <option value="1"{if: $asesmen && $asesmen.imun_ke == '1'} selected{/if}>1</option><option value="2"{if: $asesmen && $asesmen.imun_ke == '2'} selected{/if}>2</option><option value="3"{if: $asesmen && $asesmen.imun_ke == '3'} selected{/if}>3</option><option value="4"{if: $asesmen && $asesmen.imun_ke == '4'} selected{/if}>4</option><option value="5"{if: $asesmen && $asesmen.imun_ke == '5'} selected{/if}>5</option><option value="6"{if: $asesmen && $asesmen.imun_ke == '6'} selected{/if}>6</option><option value="7"{if: $asesmen && $asesmen.imun_ke == '7'} selected{/if}>7</option><option value="8"{if: $asesmen && $asesmen.imun_ke == '8'} selected{/if}>8</option><option value="10"{if: $asesmen && $asesmen.imun_ke == '10'} selected{/if}>10</option><option value="11"{if: $asesmen && $asesmen.imun_ke == '11'} selected{/if}>11</option><option value="12"{if: $asesmen && $asesmen.imun_ke == '12'} selected{/if}>12</option><option value="13"{if: $asesmen && $asesmen.imun_ke == '13'} selected{/if}>13</option>
          </select></div>
        </div>
      </div>
    </div>
    <div class="panel panel-default">
      <div class="panel-heading"><strong>SOAP</strong></div>
      <div class="panel-body">
        <div class="row"><div class="col-md-6"><label>Subyektif / Keluhan</label><textarea name="keluhan" class="form-control" rows="4">{if: $asesmen}{?=isset_or($asesmen.keluhan)?}{/if}</textarea></div><div class="col-md-6"><label>Obyektif / Pemeriksaan</label><textarea name="pemeriksaan" class="form-control" rows="4">{if: $asesmen}{?=isset_or($asesmen.pemeriksaan)?}{/if}</textarea></div></div>
        <div class="row" style="margin-top:10px;"><div class="col-md-6"><label>Assessment / Penilaian</label><textarea name="penilaian" class="form-control" rows="4">{if: $asesmen}{?=isset_or($asesmen.penilaian)?}{/if}</textarea></div><div class="col-md-6"><label>Plan / Rencana Tindak Lanjut</label><textarea name="rtl" class="form-control" rows="4">{if: $asesmen}{?=isset_or($asesmen.rtl)?}{/if}</textarea></div></div>
        <div class="row" style="margin-top:10px;"><div class="col-md-4"><label>Riwayat Penyakit Dahulu</label><textarea name="rpd" class="form-control" rows="3">{if: $asesmen}{?=isset_or($asesmen.rpd)?}{/if}</textarea></div><div class="col-md-4"><label>Riwayat Penyakit Keluarga</label><textarea name="rpk" class="form-control" rows="3">{if: $asesmen}{?=isset_or($asesmen.rpk)?}{/if}</textarea></div><div class="col-md-4"><label>Riwayat Penggunaan Obat</label><textarea name="rpo" class="form-control" rows="3">{if: $asesmen}{?=isset_or($asesmen.rpo)?}{/if}</textarea></div></div>
        <div class="row" style="margin-top:10px;"><div class="col-md-6"><label>Operasi</label><input type="text" name="operasi" class="form-control" value="{if: $asesmen}{?=isset_or($asesmen.operasi)?}{/if}"></div><div class="col-md-6"><label>Instruksi</label><textarea name="instruksi" class="form-control" rows="2">{if: $asesmen}{?=isset_or($asesmen.instruksi)?}{/if}</textarea></div></div>
      </div>
    </div>
    <div id="soap_poli_status"></div>
    <button type="submit" class="btn btn-primary" id="simpan_soap_poli"><i class="fa fa-save"></i> Simpan SOAP Poli</button>
  </form>
</div>
<div class="modal-footer"><button type="button" class="btn btn-default" data-dismiss="modal">Tutup</button></div>
<script type="text/javascript">
$(document).off('submit.soapPoli', '#form_soap_poli').on('submit.soapPoli', '#form_soap_poli', function(event){
  event.preventDefault();
  var $form = $(this), $button = $('#simpan_soap_poli'), $status = $('#soap_poli_status');
  $button.prop('disabled', true);
  $.post(mlite.url + '/' + mlite.admin + '/vedika/saveasesmenpoli?t=' + encodeURIComponent(mlite.token), $form.serialize(), null, 'json')
    .done(function(response){
      if (response && response.ok) {
        $status.html('<div class="alert alert-success">' + response.message + '</div>');
        setTimeout(function(){ $('#statusModal').modal('hide'); window.location.reload(); }, 700);
      } else {
        $status.html('<div class="alert alert-danger">' + ((response && response.message) || 'SOAP Poli gagal disimpan.') + '</div>');
        $button.prop('disabled', false);
      }
    })
    .fail(function(xhr){
      var message = 'SOAP Poli gagal disimpan.';
      if (xhr.responseJSON && xhr.responseJSON.message) message = xhr.responseJSON.message;
      $status.html('<div class="alert alert-danger">' + message + '</div>');
      $button.prop('disabled', false);
    });
});
</script>
